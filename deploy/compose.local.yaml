services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cost
      MYSQL_USER: cost
      MYSQL_PASSWORD: cost_local_password
      MYSQL_ROOT_PASSWORD: cost_root_local_password
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - cost_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  cost_mysql:
